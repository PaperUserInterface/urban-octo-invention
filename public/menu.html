<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Express Diner</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar" id="navbar"></nav>

  <div class="container">
    <h1 class="page-title">Delicious Menu</h1>
    <p class="page-subtitle">Select your favorite items and place your order</p>

    <div id="alertBox"></div>

    <div class="menu-layout">
      <!-- Food Items Grid -->
      <div>
        <div id="foodGrid" class="food-grid">
          <p style="color: var(--text-muted);">Loading menu items...</p>
        </div>
      </div>

      <!-- Order Summary / Cart -->
      <div>
        <div class="cart-card">
          <h3 class="cart-title">🛒 Your Order Summary</h3>
          <ul id="cartItems" class="cart-items">
            <li class="cart-item" style="color: var(--text-muted); text-align: center; justify-content: center; display: block; padding: 1.5rem 0;">
              No items selected yet. Choose items from the menu.
            </li>
          </ul>

          <div class="cart-total">
            <span>Total:</span>
            <span id="cartTotal">$0.00</span>
          </div>

          <button id="placeOrderBtn" onclick="placeOrder()" class="btn btn-primary" style="width: 100%;" disabled>
            Place Order
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>Course Assignment Project &bull; Restaurant Ordering App &bull; Built with Express & PostgreSQL</p>
  </footer>

  <script src="/js/common.js"></script>
  <script src="/js/menu.js"></script>
</body>
</html>
