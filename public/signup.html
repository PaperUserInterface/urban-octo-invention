<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Express Diner</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar" id="navbar"></nav>

  <div class="container">
    <div class="auth-card">
      <h2 class="page-title" style="text-align: center; margin-bottom: 0.5rem;">Create Account</h2>
      <p class="page-subtitle" style="text-align: center;">Sign up as a customer to start ordering food</p>

      <div id="alertBox"></div>

      <form id="signupForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Choose a username" required minlength="3">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Create a password" required minlength="4">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
      </form>

      <p style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html" style="color: var(--primary); font-weight: 600;">Log In</a>
      </p>
    </div>
  </div>

  <footer>
    <p>Course Assignment Project &bull; Restaurant Ordering App &bull; Built with Express & PostgreSQL</p>
  </footer>

  <script src="/js/common.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
